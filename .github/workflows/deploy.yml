name: Deploy (Cloudflare)

# A nuvem (spec publicação §2.4):
# - cada push na main publica em STAGING (a URL de teste do mantenedor);
# - PRODUÇÃO só quando o mantenedor manda: Actions → "Deploy (Cloudflare)" → Run workflow → production.
# Fica desligado até o guia do M4 terminar (variável do repositório CLOUDFLARE_READY = 1).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Onde publicar'
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_READY == '1' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'staging' }}
    env:
      TARGET: ${{ inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:worker
      - name: Build do app com nuvem
        run: npm run build
        env:
          VITE_CLOUD: '1'
          VITE_APP_ENV: ${{ env.TARGET }}
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      - name: Migrações do banco (D1)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote ${{ env.TARGET == 'staging' && '--env staging' || '' }}
      - name: Publicar o Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy ${{ env.TARGET == 'staging' && '--env staging' || '' }}
      - name: Publicar o www (leva para o domínio principal)
        if: ${{ env.TARGET == 'production' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.www.jsonc
