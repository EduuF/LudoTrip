name: Deploy (Cloudflare)

# A nuvem (spec publicação §2.4), sozinha a cada push na main:
#   1. publica em STAGING;
#   2. confere a staging no ar (scripts/smoke-live.mjs: app sem erros, API, convites, login);
#   3. só se tudo passou, publica em PRODUÇÃO.
# Se a staging falhar, a produção fica como estava.
# "Run workflow" continua servindo para republicar um ambiente à mão (por exemplo, voltar uma versão).
# Fica desligado até o guia do M4 terminar (variável do repositório CLOUDFLARE_READY = 1).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Onde publicar'
        type: choice
        options: [staging, production]
        default: staging

jobs:
  staging:
    if: ${{ vars.CLOUDFLARE_READY == '1' && (github.event_name == 'push' || inputs.target == 'staging') }}
    uses: ./.github/workflows/publicar.yml
    with:
      target: staging
    secrets: inherit

  conferir-staging:
    needs: staging
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Conferir a staging no ar
        run: node scripts/smoke-live.mjs https://staging.ludotrip.app

  production:
    needs: conferir-staging
    # No push: só depois da staging conferida. À mão: direto, quando escolhido "production".
    if: >-
      ${{ !cancelled() && vars.CLOUDFLARE_READY == '1' && (
        (github.event_name == 'push' && needs.conferir-staging.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
      ) }}
    uses: ./.github/workflows/publicar.yml
    with:
      target: production
    secrets: inherit
